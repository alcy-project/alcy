# A result line is three roles: the verb in bold bright green, what it
# acted on underlined, the note in dim. Nothing else on the line is
# coloured, so a reader can strip the codes and still have the whole
# sentence.
exit = 0
args = ["--color=always"]
contains = [
  "\u001b[1m\u001b[92mChecked\u001b[0m",
  "\u001b[4m1 file, 1 module, 1 function\u001b[0m",
  "\u001b[2m(",
]
not_contains = ["\u001b[31m"]
