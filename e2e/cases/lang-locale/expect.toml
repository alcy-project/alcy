# A locale the shell exports is the interface of another program. Set to
# a language the catalogs do not carry, it changes nothing: a build whose
# output language depends on it is a different compiler on every machine.
exit = 4
env = { LANG = "ja_JP.UTF-8", LC_ALL = "ja_JP.UTF-8", LANGUAGE = "ja" }
contains = ["Type mismatch in integer literal"]
