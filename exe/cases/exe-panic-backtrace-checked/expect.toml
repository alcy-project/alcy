# A checked overflow aborts inside the frame that computes it, which
# makes no call of its own: that frame prints its name alone, and the
# frames above it keep the sites of the calls they made. The site table
# spans the module and the nearest entry below a return address can be
# another function's call, so a frame reads only the entries above the
# start of the function it matched (ADR-0070). The frames are for the
# hosts whose frame pointer is a chain; the message and its site are
# every host's.
exit = "non-zero"
args = ["--on-panic=backtrace"]
stderr_contains = ["panic at main.al:3:7: integer overflow"]
walk_stderr_contains = [
  "  at h\n",
  "  at g (main.al:7:8)",
  "  at f (main.al:12:8)",
  "  at main (main.al:17:8)",
]
