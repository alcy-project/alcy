# An optimized backtrace shows the frames that survived. This input
# keeps them all; a loop body does not inline away.
exit = "non-zero"
args = ["--release", "--on-panic=backtrace"]
stderr_contains = [
  "panic at main.al:2:3: boom",
  "  at g (main.al:2:3)",
  "  at f (main.al:10:7)",
  "  at main (main.al:16:3)",
]
