<!-- A template: the site generator stamps one copy per language into
     site/dist/. `t:` names a catalog string; the rest are stamped
     values: lang, dist, home, header, boot, catalog, pageLinks, social,
     speculation, and stamp. -->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{t:meta.landing}}" />
    <title>alcy</title>
    {{boot}}
    {{catalog}}
    <link rel="stylesheet" href="{{dist}}shared/site.css" />
    <link rel="icon" href="{{dist}}favicon.svg" />
    {{pageLinks}}
    {{social}}
    {{speculation}}
  </head>
  <body class="site">
    <a class="skip-link" href="#content">{{t:site.skip}}</a>
    {{header}}

    <main class="site-main" id="content" tabindex="-1">
      <h1>alcy</h1>
      <p class="tagline">{{t:landing.tagline}}</p>
      <p>{{t:landing.intro}}</p>
      <div class="actions">
        <a class="primary" href="{{home}}playground/">{{t:landing.actions.playground}}</a>
        <a href="{{home}}guide/">{{t:landing.actions.guide}}</a>
        <a href="{{home}}reference/">{{t:landing.actions.reference}}</a>
      </div>
      <p>{{t:landing.behind}}</p>
    </main>

    <footer class="site-footer">
      <span>alcy · {{stamp}}</span>
      <a href="https://github.com/alcy-project/alcy" rel="noopener">GitHub</a>
    </footer>

    <link rel="modulepreload" href="{{dist}}shared/shell.js" />
    <script type="module" src="{{dist}}shared/shell.js"></script>
  </body>
</html>
