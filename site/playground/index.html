<!-- A template: the site generator stamps one copy per language into
     site/dist/. The placeholders are `t:` for catalog strings, `dist`
     for the assets, `home` for this tree's root, `settings` for the
     settings menu, and `lang`/`switch` for the language. -->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{t:meta.playground}}" />
    <title>alcy {{t:site.playground}}</title>
    <script src="{{dist}}shared/boot.js"></script>
    <link rel="stylesheet" href="{{dist}}shared/site.css" />
    <link rel="stylesheet" href="{{dist}}playground/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="{{home}}">alcy</a>
      <nav class="site-nav">
        <a href="{{home}}guide/">{{t:site.guide}}</a>
        <a href="{{home}}playground/" aria-current="page">{{t:site.playground}}</a>
        <a href="https://github.com/alcy-project/alcy" rel="noopener">GitHub</a>
      </nav>
      {{settings}}
    </header>

    <div class="toolbar">
      <label class="control">
        <span class="control-label">{{t:label.example}}</span>
        <select id="samples" aria-label="{{t:label.example}}" disabled>
          <option>{{t:samples.loading}}</option>
        </select>
      </label>
      <div class="toolbar-end">
        <div class="compiler-state" id="compiler-state" data-state="idle">
          <span class="dot"></span>
          <span id="compiler-state-text">{{t:compiler.idle}}</span>
        </div>
        <div class="toolbar-actions">
          <button id="check" type="button" title="{{t:button.checkTitle}}">
            <span>{{t:button.check}}</span>
          </button>
          <button
            id="run"
            type="button"
            class="primary"
            title="{{t:button.runTitle}}"
            aria-label="{{t:button.run}}"
          >
            <span class="run-label run-label-idle" aria-hidden="true">{{t:button.run}}</span>
            <span class="run-label run-label-busy" aria-hidden="true">{{t:button.running}}</span>
          </button>
        </div>
      </div>
    </div>

    <main class="layout">
      <section class="editor-pane" aria-label="{{t:aria.editor}}">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <div class="editor">
          <pre class="highlight" id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea
            id="source"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            wrap="off"
            aria-label="{{t:aria.source}}"
          ></textarea>
        </div>
      </section>

      <div
        class="splitter"
        id="splitter"
        role="separator"
        tabindex="0"
        aria-label="{{t:aria.splitter}}"
        aria-orientation="vertical"
        aria-valuenow="38"
        aria-valuemin="20"
        aria-valuemax="80"
      ></div>

      <aside class="side" aria-label="{{t:aria.results}}">
        <div class="tabs" role="tablist">
          <button id="tab-problems" class="tab active" role="tab" aria-selected="true" type="button">
            <span>{{t:tab.problems}}</span>
            <span class="badge" id="problems-count" hidden>0</span>
          </button>
          <button id="tab-output" class="tab" role="tab" aria-selected="false" type="button">
            <span>{{t:tab.output}}</span>
          </button>
        </div>
        <div class="panel" id="panel-problems" role="tabpanel">
          <ul class="problems" id="problems"></ul>
          <p class="empty" id="problems-empty">{{t:problems.empty}}</p>
        </div>
        <div class="panel hidden" id="panel-output" role="tabpanel">
          <p class="run-meta" id="run-meta"></p>
          <h2>stdout</h2>
          <pre class="stream" id="stdout"></pre>
          <h2>stderr</h2>
          <pre class="stream" id="stderr"></pre>
        </div>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status">{{t:status.ready}}</span>
      <span class="hint">{{t:hint.run}}</span>
      <a href="https://github.com/alcy-project/alcy" rel="noopener">GitHub</a>
    </footer>

    <noscript>
      <p class="noscript">{{t:noscript.playground}}</p>
    </noscript>

    <script type="module" src="{{dist}}playground/app.js"></script>
  </body>
</html>
