name: setup-linters
description: The Python venv (ast-grep, rumdl, ruff) and the pinned taplo CLI.

inputs:
  taplo-version:
    description: "taplo version from config.toml."
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: true

    - name: Setup Python Virtual Environment
      shell: bash
      run: |
        uv python install
        uv sync --frozen
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: Install taplo
      uses: ./.github/actions/install-taplo
      with:
        version: ${{ inputs.taplo-version }}
