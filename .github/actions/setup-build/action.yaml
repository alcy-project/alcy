# Shared toolchain setup for the standard (prebuilt LLVM) and Nix build
# environments. A check that reads the build product without building it
# takes the venv from here and passes `toolchain: false`. Callers must
# check out the repository (with submodules) before invoking this action:
# the LLVM pin is read from config.toml here, so a caller cannot pass a
# version it never read.
#
# Dependabot updates the actions the workflow files name and does not see
# this file, so the pins below are bumped by hand alongside the workflows.

name: setup-build
description: Install the Nix or prebuilt-LLVM toolchain and the Python venv. The LLVM version comes from config.toml, so callers pass none.

inputs:
  nix:
    description: "'true' selects the Nix development shell; 'false' selects the prebuilt LLVM toolchain."
    required: false
    default: "false"
  os:
    description: "Value forwarded to cxx-gn-setup (e.g. runner.os). Ignored for Nix."
    required: false
    default: ""
  toolchain:
    description: "'false' installs the Python venv alone, for a check that reads the compiler without building anything."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Nix
      if: inputs.nix == 'true'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Read the pinned LLVM
      id: versions
      if: inputs.nix != 'true' && inputs.toolchain == 'true'
      shell: bash
      run: |
        py=$(command -v python3 || command -v python)
        llvm_version=$("$py" tools/config_values.py --get llvm_toolchain_version)
        if [[ "${{ runner.os }}" == "macOS" && "${{ runner.arch }}" == "X64" ]]; then
          llvm_version=$("$py" tools/config_values.py --get llvm_toolchain_version_macos_x64)
        fi
        echo "llvm_version=$llvm_version" >> "$GITHUB_OUTPUT"

    - name: Setup Build Environment (Standard)
      if: inputs.nix != 'true' && inputs.toolchain == 'true'
      uses: pug523/actions/cxx-gn-setup@3292474a690172a990b3c2fb4868640c95a473bf
      with:
        os: ${{ inputs.os }}
        llvm_version: ${{ steps.versions.outputs.llvm_version }}
        directory: ${{ runner.temp }}/llvm

    # GN resolves libc++ headers and libraries through these variables
    # (see docs/build.md). Windows uses the MSVC STL instead.
    - name: Setup Environment Variables (Standard)
      if: inputs.nix != 'true' && inputs.toolchain == 'true'
      shell: bash
      run: |
        echo "${{ env.LLVM_PATH }}/bin" >> "$GITHUB_PATH"
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          echo "LIBCXX_INCLUDE_DIR=${{ env.LLVM_PATH }}/include/c++/v1" >> "$GITHUB_ENV"
        fi

        if [[ "${{ runner.os }}" == "Linux" ]]; then
          TARGET_INC=$(echo "${{ env.LLVM_PATH }}/include/"*linux*/c++/v1)
          echo "LIBCXX_TARGET_INCLUDE_DIR=$TARGET_INC" >> "$GITHUB_ENV"
          LIB_DIR=$(echo "${{ env.LLVM_PATH }}/lib/"*linux*)
          echo "LIBCXX_LIB_DIR=$LIB_DIR" >> "$GITHUB_ENV"
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          LIB_DIR="${{ env.LLVM_PATH }}/lib"
          LIBCXX_DIR="$LIB_DIR/libc++/v1"
          shopt -s nullglob
          FILES=("$LIB_DIR"/libc++*)
          mkdir -p "$LIBCXX_DIR"
          if [ ${#FILES[@]} -gt 0 ]; then
            cp "${FILES[@]}" "$LIBCXX_DIR/"
          fi
          echo "LIBCXX_LIB_DIR=$LIBCXX_DIR" >> "$GITHUB_ENV"
        else
          echo "LIBCXX_LIB_DIR=${{ env.LLVM_PATH }}/lib" >> "$GITHUB_ENV"
        fi

    - name: Install uv
      if: inputs.nix != 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        enable-cache: false

    - name: Setup Python virtual environment
      if: inputs.nix != 'true'
      shell: bash
      run: |
        # Some Rust wheels have no build for the host, so uv builds them
        # with cargo. cargo finds link.exe by name on PATH, where Git Bash
        # puts a link.exe of its own ahead of MSVC's. Point PATH at the
        # MSVC tools for this step only: LINK names arguments to a linker
        # and cannot choose which executable cargo starts, and exporting
        # either one globally would confuse the later C++ links.
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Match the target the dev prompt selected: x64 on Intel,
          # arm64 on ARM runners. Naming HostX64/x64 on ARM would pick an
          # x64-target cl.exe, which rejects the ARM headers in Rust
          # crates that build native code for the runner.
          target_arch=x64
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            target_arch=arm64
          fi
          export PATH="${VCToolsInstallDir}bin/HostX64/${target_arch}:$PATH"
        fi
        uv python install
        uv sync --frozen
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
