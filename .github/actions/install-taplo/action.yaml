name: install-taplo
description: Install the pinned taplo CLI that checks the tree's TOML.

inputs:
  version:
    description: "taplo version from config.toml."
    required: true

runs:
  using: composite
  steps:
    - name: Install taplo
      uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
      with:
        tool: taplo@${{ inputs.version }}
