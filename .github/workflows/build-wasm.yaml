name: Build WebAssembly

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      role:
        description: "Build role ('ci' or 'release')"
        required: false
        default: "ci"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: WebAssembly (${{ inputs.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false

    env:
      COLORTERM: 256color

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Setup GN
        uses: pug523/actions/setup-gn@6a99c1e7020935c77ea80adc3ed0e9365ec8a209

      - name: Install Ninja
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Cache Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build
          # A constant key never refreshes: the first snapshot would be
          # restored forever, however far the compiler moved on.
          key: ${{ runner.os }}-wasm-wasm32-${{ inputs.build_type }}-${{ inputs.role }}-false-build-dir-${{ hashFiles('config.toml', '**/*.gn', 'compiler/**') }}

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=${{ inputs.build_type }} --build-subdir=build --target-os=emscripten

      # The playground build carries no LLVM, so it is its own configure
      # rather than more of the one above; it comes before packaging
      # because the wasm archive carries the module, and the smoke runs
      # the whole path: launcher, C ABI, compiler, emitted module.
      - name: Build Playground
        shell: bash
        run: uv run ./tools/build.py --target=playground --mode=${{ inputs.build_type }} --build-subdir=playground --target-os=emscripten --gn-arg='alcy_backends=[]'

      - name: Run Playground Smoke
        shell: bash
        run: uv run ./tools/check_playground.py --build-subdir=playground

      - name: Package & Generate Checksum
        shell: bash
        run: |
          uv run ./tools/package.py \
            --plat=wasm \
            --arch=wasm32 \
            --mode="${{ inputs.build_type }}" \
            --role="${{ inputs.role }}" \
            --archive=tar.zst

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wasm-wasm32-${{ inputs.build_type }}
          path: |
            *.tar.zst
            *.sha256
          if-no-files-found: error

      - name: Run Tests
        shell: bash
        run: uv run ./tools/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build --target-os=emscripten
