name: Generate Summary

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: "Pattern to match checksum artifact names"
        type: string
        required: false
        default: "*"

jobs:
  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    steps:
      - name: Download All Checksum Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
        continue-on-error: true

      - name: Write Summary
        run: |
          echo "### 📦 Build Artifacts & SHA-256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          shopt -s nullglob
          files=(*.sha256)

          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ No checksum artifacts were generated." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "| Filename | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for f in "${files[@]}"; do
            HASH=$(awk '{print $1}' "$f")
            FILENAME="${f%.sha256}"
            echo "| \`$FILENAME\` | \`$HASH\` |" >> $GITHUB_STEP_SUMMARY
          done
