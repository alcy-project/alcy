name: Artifacts Summary

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: "Pattern to match artifact names"
        type: string
        required: false
        default: "*"

permissions:
  contents: read

jobs:
  summary:
    name: Artifacts Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
        continue-on-error: true

      - name: Write Summary
        run: |
          echo "### 📦 Build Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          files=(*.sha256)

          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️ No artifacts were generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "| Artifact | Size | SHA-256 Checksum |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | ---: | :--- |" >> "$GITHUB_STEP_SUMMARY"

          for f in "${files[@]}"; do
            HASH=$(awk '{print $1}' "$f")
            FILENAME="${f%.sha256}"
            SIZE=$(stat -c%s "$FILENAME" 2>/dev/null || echo "-")
            echo "| \`$FILENAME\` | $SIZE | \`$HASH\` |" >> "$GITHUB_STEP_SUMMARY"
          done
