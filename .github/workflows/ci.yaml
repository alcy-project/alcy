# Every pull request runs this workflow, because the one context a branch
# requires has to report on every one of them: a workflow that its own
# `paths:` filter skipped reports nothing, and the check it stood for
# stays "Expected" on a change that touched a document. The `changes` job
# reads the diff instead, and the jobs below skip when it has nothing for
# them to read.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep `main` runs intact so every merged commit keeps its own artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI answers questions about a tree it can build, and a change to prose
  # or to the site asks none of them. The jobs below read this output and
  # skip; what is listed is what CI has nothing to ask about, so a file
  # that is neither of those runs the whole of it.
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 0

      - name: Read the Changed Paths
        id: diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          echo "changed in ${base}..HEAD:"
          changed=$(git diff --name-only "$base" HEAD)
          printf '%s\n' "$changed"

          code=false
          if [ -n "$changed" ] && printf '%s\n' "$changed" | grep -Evq '^(docs/|site/)|(\.md$)|^LICENSE$'; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  debug:
    name: Debug Build & Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      build_type: debug
      role: ci

  release:
    name: Release Build & Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: ci

  wasm-debug:
    name: WebAssembly Debug Build & Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: debug
      role: ci

  wasm-release:
    name: WebAssembly Release Build & Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: ci

  # Lint needs a compilation database, which `gn gen` produces and the
  # whole toolchain is needed to produce. clang-tidy over every
  # translation unit is the whole of the cost, so the job runs as three
  # shards and the wall clock is a third of the tree; the whole-tree
  # checks (format, gn, the rules, the ASCII gate) ride with shard 1/3,
  # and it belongs beside the builds rather than in a workflow that a
  # documentation change also triggers -- as a job that a change with
  # nothing to read skips, which is what `changes` decides.
  lint:
    name: Tree Lint (${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Lint
        shell: bash
        run: uv run ./tools/lint.py --shard ${{ matrix.shard }}

  # The ratchet rather than a threshold: it fails when line coverage of
  # the compiler falls below build/coverage_baseline.json, so it needs
  # its own instrumented build and cannot share the matrix's.
  coverage:
    name: Coverage Ratchet
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      # Nothing is cached here on purpose. A stale instrumented tree
      # yields profile data that describes a compiler that no longer
      # exists, and the ratchet then fails on a number nobody can
      # account for.
      - name: Check Coverage
        shell: bash
        run: uv run ./tools/check_coverage.py

  # The layer that can see a wrong code-generation decision become memory
  # corruption: the generated program is instrumented, which alcy cannot
  # do to an object it wrote itself, so the case goes through
  # --emit=llvm-ir and clang. Refuses rather than degrading where clang
  # is absent, so this job cannot pass without having run.
  sanitizers:
    name: Generated-Code Sanitizers
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Run exe Acceptance (sanitized)
        shell: bash
        run: uv run ./tools/check_exe.py --build-subdir=build --sanitize

  # The grammar is a second reading of the language, and the compiler is
  # the oracle for it: every source this job's build accepts must parse
  # there without an ERROR or a MISSING node. It needs a build, so it does
  # not run in the matrix, and it asks one question rather than the ten the
  # matrix would have asked it. The corpus half of the same check needs no
  # build at all and runs in the Grammar job.
  grammar-vs-compiler:
    name: Grammar Against the Compiler
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Install the tree-sitter CLI
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          TS_VERSION=$(python3 tools/config_values.py --get tree_sitter_cli_version)
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TS_VERSION}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Check the Grammar Against the Compiler
        shell: bash
        run: uv run ./tools/check_treesitter.py --differential --build-subdir=build

  # A subcommand of the driver is what a check is about, so a subcommand
  # is what a check is named after. Each entry below is one command, so the
  # three share one definition and the matrix names them apart, and each
  # runs the driver the matrix built rather than a tree of its own.
  #
  # What is left here is what the host does not answer for: the formatter
  # and the borrow rules read source and ask the driver about it, and a wasm
  # module comes out of the driver's own backend to be run by the same bun
  # on every platform. A corpus whose cases link a program or run one is a
  # question the platform answers, and those stay in the matrix.
  harness:
    name: ${{ matrix.name }}
    needs: [debug]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format (alcy fmt)
            command: uv run ./tools/check_fmt.py --build-subdir=build
            bun: false
          - name: Borrow Rules (alcy check)
            command: uv run ./tools/check_borrow_rules.py --build-subdir=build
            bun: false
          - name: Wasm Acceptance (alcy build --target=wasm)
            command: uv run ./tools/check_wasm.py --build-subdir=build
            bun: true
    uses: ./.github/workflows/harness.yaml
    with:
      name: ${{ matrix.name }}
      command: ${{ matrix.command }}
      bun: ${{ matrix.bun }}

  # The engine is built and run, and what comes out is checked for shape:
  # every case present, every sample counted, a clock named, a figure
  # above zero, and a generated source the compiler accepts. It judges
  # nothing about timing, and it used to run in all ten matrix entries,
  # which is ten times the cost for one answer.
  benchmarks:
    name: Benchmark Harness
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Check Benchmark Harness
        shell: bash
        run: uv run ./tools/run_benchmarks.py smoke --build-subdir=build

  # The fuzz targets are built and run for a short budget. The corpus
  # and the known-failure manifest are what discriminate: a run whose
  # artifacts are all recognised is the pass, and a fresh crash fails
  # the job with the bytes libFuzzer minimised it to.
  fuzz:
    name: Fuzz Smoke
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      # The fuzz build is a whole compiler with the fuzzer's own flags in
      # a build directory of its own, so it caches the way the matrix's
      # build directory does: restored when the sources have not moved,
      # rebuilt incrementally when they have.
      - name: Cache Fuzz Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/fuzz
          key: ${{ runner.os }}-fuzz-build-dir-${{ hashFiles('.gn', 'BUILD.gn', 'src/**', 'config.toml') }}
          restore-keys: ${{ runner.os }}-fuzz-build-dir-

      - name: Build and Run the Fuzz Targets
        shell: bash
        run: uv run ./tools/run_fuzz.py

  # The matrix builds the host and the wasm target; the other operating
  # systems a manifest can name are only ever configured here, which is
  # where a toolchain definition that cannot produce one of them would
  # otherwise surface. Gen-only asks nothing of the compilers it
  # configures for, so the answer costs a minute.
  cross-gen:
    name: Cross-Target Gen
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Configure Every Target Operating System
        shell: bash
        run: uv run ./tools/cross.sh --gen-only

  summary:
    needs: [changes, debug, release, wasm-debug, wasm-release]
    if: always() && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/generate-summary.yaml
    with:
      artifact_pattern: "*"

  # The single check to require. Branch protection names this job and
  # nothing else, so a job added above is required by one line here and no
  # edit to the repository settings -- and the step reads the job names out
  # of this file to fail when that line is missing. A job that did not run
  # is not a pass unless the change had nothing for CI to read, and every
  # conclusion is printed so the line that failed is the line that is red.
  gate:
    name: Gate
    needs:
      - changes
      - debug
      - release
      - wasm-debug
      - wasm-release
      - lint
      - coverage
      - sanitizers
      - grammar-vs-compiler
      - harness
      - benchmarks
      - fuzz
      - cross-gen
      - summary
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Read the Job Conclusions
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - "$NEEDS" <<'PY'
          import json
          import re
          import sys

          results = json.loads(sys.argv[1])
          code = results["changes"].get("outputs", {}).get("code") == "true"

          for name in sorted(results):
              print(f"{results[name].get('result', ''):<9} {name}")

          bad = {}
          for name, job in results.items():
              result = job.get("result")
              if result == "success":
                  continue
              # A change with nothing for CI to read skips what reads it.
              if result == "skipped" and not code:
                  continue
              bad[name] = result or "no conclusion"

          # Every job this file declares is a job this one waited for, so a
          # job added above is required by adding a line, not by remembering
          # to add one.
          with open(".github/workflows/ci.yaml", encoding="utf-8") as handle:
              declared = set(re.findall(
                  r"(?m)^  ([a-z][a-z0-9-]*):$",
                  handle.read().partition("\njobs:\n")[2],
              ))
          unneeded = sorted(declared - set(results) - {"gate"})
          if unneeded:
              bad["not waited for"] = ", ".join(unneeded)

          if bad:
              print()
              print("not a pass: " + ", ".join(f"{n} ({r})" for n, r in sorted(bad.items())))
              sys.exit(1)
          PY
