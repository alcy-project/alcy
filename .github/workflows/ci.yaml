# Every run of this workflow answers every question it owns. A `paths:`
# filter would leave skipped jobs without a conclusion, keeping required
# checks at "Expected", so there is no path filtering and no diff job:
# a documentation change pays for the whole matrix, deliberately.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep `main` runs intact so every merged commit keeps its own artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The format dry run is not here: lint's first shard already runs it
  # over the whole tree with clang-format set up, so a job of its own
  # would pay for the toolchain twice for the same answer.
  spelling:
    name: Spell Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Spell Check Repository
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888

  specification:
    name: Specification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      # The specification states what a program is written against, so it
      # names no file, module, symbol, or diagnostic code of the compiler
      # that implements it. It reads documents and needs no build, no
      # toolchain, and no submodule, so it does not belong in a job that
      # pays for all three.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check the Specification
        shell: bash
        run: uv run ./tools/check_spec.py

  # The grammar's corpus is the specification read back as syntax, so it is
  # checked the way the specification is: no build, no toolchain, no
  # submodule. What it needs on top of that is the CLI, since the parser is
  # generated from grammar.js rather than written by hand.
  grammar:
    name: Grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Install the tree-sitter CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          TS_VERSION=$(python3 tools/config_values.py --get tree_sitter_cli_version)
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TS_VERSION}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check the Grammar
        shell: bash
        run: uv run ./tools/check_treesitter.py --grammar

  # The tree's own linters share one setup and each costs less than a
  # second, so they share a job: four jobs would pay for the same
  # checkout and virtual environment four times for the same answer.
  tree-checks:
    name: Tree Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Read the pinned taplo
        id: versions
        run: echo "taplo=$(python3 tools/config_values.py --get taplo_version)" >> "$GITHUB_OUTPUT"

      - name: Install taplo
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: taplo@${{ steps.versions.outputs.taplo }}

      - name: Check TOML Formatting
        # The default log lists every file the glob collected; the errors
        # that matter are the level RUST_LOG keeps.
        run: RUST_LOG=error taplo fmt --check

      - name: Check Markdown
        run: uv run rumdl check .

      - name: Test the ast-grep Rules
        run: uv run ast-grep test

      - name: Scan the Compiler with the Rules
        run: uv run ast-grep scan --error src

      - name: Check the Python Tools
        run: |
          uv run ruff check tools
          uv run ruff format --check tools

      - name: Check the Workflows
        run: uv run jactionlint

  debug:
    name: Debug Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: debug
      role: ci

  release:
    name: Release Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: ci

  wasm-debug:
    name: Wasm Debug
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: debug
      role: ci

  wasm-release:
    name: Wasm Release
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: ci

  # Lint needs a compilation database, which `gn gen` produces and the
  # whole toolchain is needed to produce. clang-tidy over every
  # translation unit is the whole of the cost, so the job runs as three
  # shards and the wall clock is a third of the tree; the whole-tree
  # checks (format, gn, the rules, the ASCII gate) ride with shard 1/3,
  # and it belongs beside the builds that produce the compilation
  # database it reads.
  lint:
    name: Lint (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Lint
        shell: bash
        run: uv run ./tools/lint.py --shard ${{ matrix.shard }}

  # The ratchet rather than a threshold: it fails when line coverage of
  # the compiler falls below build/coverage_baseline.json, so it needs
  # its own instrumented build and cannot share the matrix's.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      # Nothing is cached here on purpose. A stale instrumented tree
      # yields profile data that describes a compiler that no longer
      # exists, and the ratchet then fails on a number nobody can
      # account for.
      - name: Build Instrumented Tree
        shell: bash
        run: uv run ./tools/check_coverage.py --build-only

      - name: Check Coverage
        shell: bash
        run: uv run ./tools/check_coverage.py --no-build

  # The layer that can see a wrong code-generation decision become memory
  # corruption: the generated program is instrumented, which alcy cannot
  # do to an object it wrote itself, so the case goes through
  # --emit=llvm-ir and clang. Refuses rather than degrading where clang
  # is absent, so this job cannot pass without having run.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Run exe Acceptance (sanitized)
        shell: bash
        run: uv run ./tools/check_cases.py --steps=program --mode=sanitized --build-subdir=build

  # The grammar is a second reading of the language, and the compiler is
  # the oracle for it: every source the compiler accepts must parse there
  # without an ERROR or a MISSING node. Both this and the census below ask
  # the release binary the matrix already built, so neither pays for a
  # build of its own. The corpus half of the grammar check needs no
  # compiler at all and runs in the grammar job above.
  grammar-vs-compiler:
    name: Grammar vs Compiler
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          toolchain: false

      - name: Install the tree-sitter CLI
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          TS_VERSION=$(python3 tools/config_values.py --get tree_sitter_cli_version)
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TS_VERSION}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Take the Release Compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: alcy-compiler-release-linux-x86_64
          path: out/ci-release

      - name: Make the Compiler Executable
        shell: bash
        run: chmod +x out/ci-release/alcy out/ci-release/comp_census

      - name: Check the Grammar Against the Compiler
        shell: bash
        run: uv run ./tools/check_treesitter.py --differential --build-subdir=ci-release

  # The second engine, over the whole acceptance corpus: every case the
  # front end accepts is lowered to binary IR and interpreted function by
  # function. A refusal the engine has not declared, or a compiler bug it
  # reports instead of an answer, fails here. The corpus is checked once
  # against the same release compiler the matrix built rather than once
  # per platform, because the question the engine answers is about IR and
  # not about a host.
  comp-census:
    name: Compiler Census
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          toolchain: false

      - name: Take the Release Compiler
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: alcy-compiler-release-linux-x86_64
          path: out/ci-release

      - name: Make the Compiler Executable
        shell: bash
        run: chmod +x out/ci-release/alcy out/ci-release/comp_census

      - name: Check the Compiler Engine Against the Corpus
        shell: bash
        run: uv run ./tools/check_comp.py --build-subdir=ci-release

  # A subcommand of the driver is what a check is about, so a subcommand
  # is what a check is named after. Each entry below is one command, so the
  # four share one definition and the matrix names them apart, and each
  # runs the driver the matrix built rather than a tree of its own.
  #
  # What is left here is what the host does not answer for: the formatter
  # and the borrow rules read source and ask the driver about it, and a wasm
  # module comes out of the driver's own backend to be run by the same bun
  # on every platform. Both wasm cases ask the same question of that
  # backend: the wasm corpus exercises it, and the exe corpus answers
  # whether the lowering agrees with the one that links a program. A
  # corpus whose cases link or run natively is a platform question and
  # stays in the matrix.
  harness:
    name: ${{ matrix.name }}
    needs: [debug]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: uv run ./tools/check_fmt.py --build-subdir=build
            bun: false
          - name: Borrow Rules
            command: uv run ./tools/check_borrow_rules.py --build-subdir=build
            bun: false
          - name: Wasm Acceptance
            command: uv run ./tools/check_cases.py --cases-root=e2e/wasm --steps=cli,program --mode=wasm --build-subdir=build
            bun: true
          - name: Wasm Programs
            command: uv run ./tools/check_cases.py --steps=program --mode=wasm --build-subdir=build
            bun: true
    uses: ./.github/workflows/harness.yaml
    with:
      name: ${{ matrix.name }}
      command: ${{ matrix.command }}
      bun: ${{ matrix.bun }}

  # The engine is built and run, and what comes out is checked for shape:
  # every case present, every sample counted, a clock named, a figure
  # above zero, and a generated source the compiler accepts. It judges
  # nothing about timing, and it used to run in every matrix entry, which
  # multiplied the cost for one answer.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Check Benchmark Harness
        shell: bash
        run: uv run ./tools/run_benchmarks.py smoke --build-subdir=build

  # The fuzz targets are built and run for a short budget. The corpus
  # and the known-failure manifest are what discriminate: a run whose
  # artifacts are all recognised is the pass, and a fresh crash fails
  # the job with the bytes libFuzzer minimised it to.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      # The fuzz build is a whole compiler with the fuzzer's own flags in
      # a build directory of its own, so it caches the way the matrix's
      # build directory does: restored when the sources have not moved,
      # rebuilt incrementally when they have.
      - name: Cache Fuzz Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/fuzz
          key: ${{ runner.os }}-fuzz-build-dir-${{ hashFiles('.gn', 'BUILD.gn', 'src/**', 'config.toml') }}
          restore-keys: ${{ runner.os }}-fuzz-build-dir-

      - name: Build Fuzz Targets
        shell: bash
        run: uv run ./tools/run_fuzz.py --build

      - name: Run Fuzz Targets
        shell: bash
        run: uv run ./tools/run_fuzz.py --no-build

  # The matrix builds the host and the wasm target; the other operating
  # systems a manifest can name are only ever configured here, which is
  # where a toolchain definition that cannot produce one of them would
  # otherwise surface. Gen-only asks nothing of the compilers it
  # configures for, so the answer costs a minute.
  cross-gen:
    name: Cross Gen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Configure Every Target Operating System
        shell: bash
        run: uv run ./tools/cross.py --gen-only

  summary:
    name: Summary
    needs: [
      spelling,
      specification,
      grammar,
      tree-checks,
      debug,
      release,
      wasm-debug,
      wasm-release,
    ]
    if: always()
    uses: ./.github/workflows/artifacts-summary.yaml
    with:
      artifact_pattern: "*"
