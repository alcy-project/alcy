name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - compiler/**
      - lib/**
      - e2e/**
      - exe/**
      - samples/**
      - benchmarks/**
      - third_party/**
      - build/**
      - tools/**
      - treesitter/**
      - .github/workflows/**
      - .github/actions/**
      - .clang-format
      - .clang-tidy
      - .gn
      - BUILD.gn
      - CPPLINT.cfg
      - config.toml
      - uv.lock
      - flake.nix
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

permissions:
  contents: read

# Keep `main` runs intact so every merged commit keeps its own artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      llvm_toolchain_version: ${{ steps.parse.outputs.llvm_toolchain_version }}
      llvm_fork_tag: ${{ steps.parse.outputs.llvm_fork_tag }}
      taplo_version: ${{ steps.parse.outputs.taplo_version }}
      tree_sitter_cli_version: ${{ steps.parse.outputs.tree_sitter_cli_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Parse config.toml
        id: parse
        run: |
          toolchain_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_toolchain_version"])')
          fork_tag=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_fork_tag"])')
          echo "llvm_toolchain_version=${toolchain_ver}" >> $GITHUB_OUTPUT
          echo "llvm_fork_tag=${fork_tag}" >> $GITHUB_OUTPUT
          taplo_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["taplo_version"])')
          echo "taplo_version=${taplo_ver}" >> $GITHUB_OUTPUT
          ts_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["tree_sitter_cli_version"])')
          echo "tree_sitter_cli_version=${ts_ver}" >> $GITHUB_OUTPUT

  debug:
    needs: [load-config]
    name: Debug Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: debug
      role: ci
      llvm_version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

  release:
    needs: [load-config]
    name: Release Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: ci
      llvm_version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

  wasm-debug:
    needs: [load-config]
    name: WebAssembly Debug Build & Test
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: debug
      role: ci

  wasm-release:
    needs: [load-config]
    name: WebAssembly Release Build & Test
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: ci

  # Lint needs a compilation database, which `gn gen` produces and the
  # whole toolchain is needed to produce. It is a minute of clang-tidy
  # over every translation unit, and it belongs beside the builds rather
  # than in a workflow that a documentation change also triggers.
  lint:
    needs: [load-config]
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Lint
        shell: bash
        run: uv run ./tools/lint.py

  # The ratchet rather than a threshold: it fails when line coverage of
  # the compiler falls below build/coverage_baseline.json, so it needs
  # its own instrumented build and cannot share the matrix's.
  coverage:
    needs: [load-config]
    name: Coverage Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      # Nothing is cached here on purpose. A stale instrumented tree
      # yields profile data that describes a compiler that no longer
      # exists, and the ratchet then fails on a number nobody can
      # account for.
      - name: Check Coverage
        shell: bash
        run: uv run ./tools/check_coverage.py

  # The layer that can see a wrong code-generation decision become memory
  # corruption: the generated program is instrumented, which alcy cannot
  # do to an object it wrote itself, so the case goes through
  # --emit=llvm-ir and clang. Refuses rather than degrading where clang
  # is absent, so this job cannot pass without having run.
  sanitizers:
    needs: [load-config]
    name: Generated-Code Sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Run exe Acceptance (sanitized)
        shell: bash
        run: uv run ./tools/check_exe.py --build-subdir=build --sanitize

  # The grammar is a second reading of the language, and the compiler is
  # the oracle for it: every source this job's build accepts must parse
  # there without an ERROR or a MISSING node. It needs a build, so it does
  # not run in the matrix, and it asks one question rather than the ten the
  # matrix would have asked it. The corpus half of the same check needs no
  # build at all and runs in the Grammar job.
  grammar-vs-compiler:
    needs: [load-config]
    name: Grammar Against the Compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Install the tree-sitter CLI
        run: |
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${{ needs.load-config.outputs.tree_sitter_cli_version }}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Check the Grammar Against the Compiler
        shell: bash
        run: uv run ./tools/check_treesitter.py --differential --build-subdir=build

  # The engine is built and run, and what comes out is checked for shape:
  # every case present, every sample counted, a clock named, a figure
  # above zero, and a generated source the compiler accepts. It judges
  # nothing about timing, and it used to run in all ten matrix entries,
  # which is ten times the cost for one answer.
  benchmarks:
    needs: [load-config]
    name: Benchmark Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Build All
        shell: bash
        run: uv run ./tools/build.py --target=all --mode=debug --build-subdir=build

      - name: Check Benchmark Harness
        shell: bash
        run: uv run ./tools/run_benchmarks.py smoke --build-subdir=build

  # The fuzz targets are built and run for a short budget. The corpus
  # and the known-failure manifest are what discriminate: a run whose
  # artifacts are all recognised is the pass, and a fresh crash fails
  # the job with the bytes libFuzzer minimised it to.
  fuzz:
    needs: [load-config]
    name: Fuzz Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Build and Run the Fuzz Targets
        shell: bash
        run: uv run ./tools/run_fuzz.py

  summary:
    needs: [debug, release, wasm-debug, wasm-release]
    if: always()
    uses: ./.github/workflows/generate-summary.yaml
    with:
      artifact_pattern: "*"
