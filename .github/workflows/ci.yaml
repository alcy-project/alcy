name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - src/**
      - e2e/**
      - exe/**
      - runtime/**
      - third_party/**
      - build/**
      - .github/workflows/**
      - .github/actions/**
      - .clang-format
      - .clang-tidy
      - .gn
      - BUILD.gn
      - CPPLINT.cfg
      - config.toml
      - uv.lock
      - flake.nix
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

permissions:
  contents: read

# Keep `main` runs intact so every merged commit keeps its own artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-24.04
    outputs:
      llvm_toolchain_version: ${{ steps.parse.outputs.llvm_toolchain_version }}
      llvm_fork_tag: ${{ steps.parse.outputs.llvm_fork_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Parse config.toml
        id: parse
        run: |
          toolchain_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_toolchain_version"])')
          fork_tag=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_fork_tag"])')
          echo "llvm_toolchain_version=${toolchain_ver}" >> $GITHUB_OUTPUT
          echo "llvm_fork_tag=${fork_tag}" >> $GITHUB_OUTPUT

  debug:
    needs: [load-config]
    name: Debug Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: debug
      role: ci
      llvm_version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

  release:
    needs: [load-config]
    name: Release Build & Test
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: ci
      llvm_version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

  wasm-debug:
    needs: [load-config]
    name: WebAssembly Debug Build & Test
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: debug
      role: ci

  wasm-release:
    needs: [load-config]
    name: WebAssembly Release Build & Test
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: ci

  summary:
    needs: [debug, release, wasm-debug, wasm-release]
    if: always()
    uses: ./.github/workflows/generate-summary.yaml
    with:
      artifact_pattern: "*"
