name: Build & Test

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      # 'ci': build the compiler, run all verifications, and package all outputs (including tests and benchmarks).
      # 'release': build the compiler, run all verifications, and package release binaries/libraries only.
      role:
        description: "Build role ('ci' or 'release')"
        required: false
        default: "ci"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ inputs.role }}${{ matrix.nix && '-nix' || '' }})
    runs-on: ${{ matrix.os }}
    # The slowest entry finishes inside fifteen minutes, and a cold cache
    # roughly doubles that; an hour still returns a stuck job's slot.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: false
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: true
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: false
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: true
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
            nix: false

    env:
      COLORTERM: 256color

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: ${{ matrix.nix && 'true' || 'false' }}
          os: ${{ runner.os }}

      - name: Cache Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-build-dir-${{ hashFiles('.gn', 'BUILD.gn', 'src/**', 'config.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-build-dir-

      - name: Build All
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/build.py --target=all --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Package & Generate Checksum
        shell: bash
        # --verify unpacks the archive and runs the binary it carries, so
        # packaging is a path a consumer took rather than a file the
        # runner wrote.
        run: |
          ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/package.py \
            --plat="${{ matrix.plat }}" \
            --arch="${{ matrix.arch }}" \
            --mode="${{ inputs.build_type }}" \
            --role="${{ inputs.role }}" \
            --archive="${{ matrix.archive }}" \
            --verify \
            ${{ matrix.nix && '--nix' || '' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: |
            *.${{ matrix.archive }}
            *.sha256
          if-no-files-found: error
          # Ten archives per run: two weeks keeps a merged commit's build
          # reachable without paying for ninety days of them.
          retention-days: 14

      - name: Run Tests
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build

      # The language server is a process an editor talks to over a pipe;
      # this drives the built binary through one session so the framing,
      # the diagnostics, and the formatter edit are exercised as a whole.
      - name: Run LSP Smoke
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_lsp.py --build-subdir=build

      # The corpora of subcommand cases - the type-check cases, the borrow
      # rules, the compile-and-run cases, and the wasm cases - run once each
      # in the CI workflow's `harness` job, where a failure lands on the verb
      # that broke. What runs here is what a platform answers differently: a
      # sample kept as an example still compiles, links, and prints.
      - name: Run Samples
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_exe.py --build-subdir=build --cases-root=samples

      - name: Verify Static Linkage
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/verify_static_linkage.py --build-dir=out/build

      # The benchmark harness is checked once, in the CI workflow's
      # `benchmarks` job, rather than in each of the ten matrix entries.
      # It judges shape and not timing, so every entry was answering the
      # same question ten times over.

      - name: Run Smoke Test
        shell: bash
        run: |
          exe=""
          if [[ "${{ matrix.plat }}" == "windows" ]]; then exe=".exe"; fi
          bin="./out/build/alcy${exe}"

          version_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --version)
          echo "$version_out"

          help_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --help)
          echo "$help_out"
