name: Build & Test

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      # 'test': build the compiler, build and run the tests (plus lint on
      # the Linux standard debug leg). 'dist': build the compiler, verify
      # static linkage, and upload release packages (no test run).
      role:
        required: true
        type: string
      llvm_version:
        description: "Prebuilt LLVM version. If omitted, read from config.toml."
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ inputs.role }}${{ matrix.nix && '-nix' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep in sync with the `wasm` job in ci.yaml, which covers
      # wasm32-unknown-emscripten separately because it needs Emscripten.
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.gz
            nix: false
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.gz
            nix: true
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.gz
            nix: false
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.gz
            nix: true
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
            nix: false

    env:
      COLORTERM: 256color
      basename: alcy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Read config.toml
        id: config
        shell: bash
        run: |
          LLVM_VER="${{ inputs.llvm_version }}"
          if [ -z "$LLVM_VER" ]; then
            LLVM_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_toolchain_version"])')
          fi
          echo "llvm_version=${LLVM_VER}" >> $GITHUB_OUTPUT

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          nix: ${{ matrix.nix && 'true' || 'false' }}
          os: ${{ runner.os }}
          llvm-version: ${{ steps.config.outputs.llvm_version }}

      - name: Cache build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ inputs.llvm_version }}-build-dir

      - name: Build (Nix)
        if: matrix.nix
        shell: bash
        # dist builds `all`: an explicit `ninja default` only covers
        # phony/default (group alcy), while the tests/benchmarks executables
        # are orphans that exist solely under `all`.
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/build.py --target=${{ inputs.role == 'dist' && 'all' || 'default' }} --mode=${{ inputs.build_type }} --build-subdir=build"

      - name: Build (Standard)
        if: "!matrix.nix"
        shell: bash
        run: uv run ./build/scripts/build.py --target=${{ inputs.role == 'dist' && 'all' || 'default' }} --mode=${{ inputs.build_type }} --build-subdir=build

      # The test role keeps the debug and release test signal identical to
      # the old layout; the dist role skips this so packaging never waits
      # for (or re-runs) the test suite.
      - name: Build tests and run (Nix)
        if: matrix.nix && inputs.role == 'test'
        shell: bash
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build"

      - name: Build tests and run (Standard)
        if: "!matrix.nix && inputs.role == 'test'"
        shell: bash
        run: uv run ./build/scripts/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build

      # File-based acceptance over the built compiler. Runs wherever the
      # unit suite runs; the wasm job cannot execute the native binary.
      - name: Run e2e acceptance (Nix)
        if: matrix.nix && inputs.role == 'test'
        shell: bash
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/e2e.py --build-subdir=build"

      - name: Run e2e acceptance (Standard)
        if: "!matrix.nix && inputs.role == 'test'"
        shell: bash
        run: uv run ./build/scripts/e2e.py --build-subdir=build

      - name: Check runtime (Nix)
        if: matrix.nix && inputs.role == 'test'
        shell: bash
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/check_runtime.py --build-subdir=build"

      - name: Check runtime (Standard)
        if: "!matrix.nix && inputs.role == 'test'"
        shell: bash
        run: uv run ./build/scripts/check_runtime.py --build-subdir=build

      # Execution acceptance over built programs. Same legs as the
      # runtime check: linking needs the system compiler there too.
      - name: Run exe acceptance (Nix)
        if: matrix.nix && inputs.role == 'test'
        shell: bash
        env:
          CC: clang
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/check_exe.py --build-subdir=build"

      - name: Run exe acceptance (Standard)
        if: "!matrix.nix && inputs.role == 'test'"
        shell: bash
        env:
          CC: clang
        run: uv run ./build/scripts/check_exe.py --build-subdir=build

      # Single lint leg: clang-tidy and include-cleaner need the compile
      # database from the configure step above, so lint stays coupled to a
      # build leg instead of running standalone. Fast checks (formatting,
      # spelling) live in the `style` job in ci.yaml.
      - name: Lint
        if: inputs.role == 'test' && inputs.build_type == 'debug' && runner.os == 'Linux' && !matrix.nix
        shell: bash
        run: uv run ./build/scripts/lint.py

      - name: Verify static linkage (Nix)
        if: matrix.nix && inputs.role == 'dist'
        shell: bash
        run: |
          set -euo pipefail
          echo "Entering Nix development environment..."
          nix develop .#default --command bash -c '
            set -euo pipefail
            echo "Verifying tools..."
            command -v llvm-readobj
            llvm-readobj --version
            echo "Running static linkage verification..."
            uv run python ./build/scripts/verify_static_linkage.py \
              --build-dir=out/build
          '

      - name: Verify static linkage (Standard)
        if: "!matrix.nix && inputs.role == 'dist'"
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying tools..."
          command -v llvm-readobj
          llvm-readobj --version
          echo "Running static linkage verification..."
          uv run python ./build/scripts/verify_static_linkage.py \
            --build-dir=out/build

      - name: Package & Generate Checksum
        if: inputs.role == 'dist'
        shell: bash
        run: |
          mkdir -p dist
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          if [ -f README.md ]; then cp README.md dist/; fi

          # Ship an explicit allowlist of final link outputs only. The build
          # directory also holds obj/ and the third_party/llvm install
          # (hundreds of MB), which must never reach the artifacts. One
          # package shape serves both CI and releases: everything in it is
          # shippable, and nothing build-local leaks in.
          EXE=""
          if [[ "${{ matrix.plat }}" == "windows" ]]; then EXE=".exe"; fi
          for bin in alcy tests benchmarks; do
            if [ -f "out/build/${bin}${EXE}" ]; then
              cp "out/build/${bin}${EXE}" dist/
            else
              echo "::error::expected binary missing: out/build/${bin}${EXE}"
              exit 1
            fi
          done
          if [ -f out/build/libalcy.a ]; then cp out/build/libalcy.a dist/; fi
          if [ -f out/build/alcy.lib ]; then cp out/build/alcy.lib dist/; fi

          FILE="${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}.${{ matrix.archive }}"
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            cd dist && 7z a "../${FILE}" * && cd ..
          else
            cd dist && tar -czvf "../${FILE}" * && cd ..
          fi

          if command -v sha256sum &> /dev/null; then
            sha256sum "$FILE" > "${FILE}.sha256"
          else
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          fi

      - name: Upload build artifacts
        if: inputs.role == 'dist'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: |
            *.${{ matrix.archive }}
            *.sha256
          if-no-files-found: error
