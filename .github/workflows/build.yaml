name: Build & Test

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      # 'ci': build the compiler, run all verifications, and package all outputs (including tests and benchmarks).
      # 'release': build the compiler, run all verifications, and package release binaries/libraries only.
      role:
        description: "Build role ('ci' or 'release')"
        required: false
        default: "ci"
        type: string
      llvm_version:
        description: "Prebuilt LLVM version."
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ inputs.role }}${{ matrix.nix && '-nix' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep in sync with the `wasm` job in ci.yaml, which covers
      # wasm32-unknown-emscripten separately because it needs Emscripten.
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: false
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: true
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: false
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: true
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
            nix: false

    env:
      COLORTERM: 256color
      CC: clang

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: ${{ matrix.nix && 'true' || 'false' }}
          os: ${{ runner.os }}
          llvm-version: ${{ inputs.llvm_version }}

      - name: Cache Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ inputs.llvm_version }}-build-dir-${{ hashFiles('.gn', 'BUILD.gn', 'src/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ inputs.llvm_version }}-build-dir-

      - name: Build All
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./build/scripts/build.py --target=all --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Upload Intermediates for Testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-out-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: out/build/
          retention-days: 1

      - name: Package & Generate Checksum
        shell: bash
        run: |
          mkdir -p dist
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          if [ -f README.md ]; then cp README.md dist/; fi

          # Ship an explicit allowlist of final link outputs only. The build
          # directory also holds obj/ and the third_party/llvm install
          # (hundreds of MB), which must never reach the artifacts.
          # Filter executables according to the requested role.
          EXE=""
          if [[ "${{ matrix.plat }}" == "windows" ]]; then EXE=".exe"; fi

          ROLE="${{ inputs.role }}"
          if [[ "$ROLE" == "release" ]]; then
            TARGET_BINS=("alcy")
          else
            TARGET_BINS=("alcy" "tests" "benchmarks")
          fi

          for bin in "${TARGET_BINS[@]}"; do
            if [ -f "out/build/${bin}${EXE}" ]; then
              cp "out/build/${bin}${EXE}" dist/
            else
              echo "::error::expected binary missing: out/build/${bin}${EXE}"
              exit 1
            fi
          done

          if [ -f out/build/libalcy.a ]; then cp out/build/libalcy.a dist/; fi
          if [ -f out/build/alcy.lib ]; then cp out/build/alcy.lib dist/; fi

          FILE="alcy-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}.${{ matrix.archive }}"
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            cd dist && 7z a "../${FILE}" * && cd ..
          else
            # Use zstd pipeline to bypass differences between BSD tar and GNU tar flags across macOS/Linux runners.
            cd dist && tar cf - * | zstd -3 -T0 -o "../${FILE}" && cd ..
          fi

          if command -v sha256sum &> /dev/null; then
            sha256sum "$FILE" > "${FILE}.sha256"
          else
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: |
            *.${{ matrix.archive }}
            *.sha256
          if-no-files-found: error

  test:
    name: Test (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ inputs.role }}${{ matrix.nix && '-nix' || '' }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: false
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: true
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: false
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: true
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
            nix: false

    env:
      COLORTERM: 256color
      CC: clang

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: ${{ matrix.nix && 'true' || 'false' }}
          os: ${{ runner.os }}
          llvm-version: ${{ inputs.llvm_version }}

      - name: Download Build Intermediates
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: build-out-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: out/build

      - name: Run Tests
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./build/scripts/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Run e2e Acceptance
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./build/scripts/check_e2e.py --build-subdir=build

      - name: Check Runtime
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./build/scripts/check_runtime.py --build-subdir=build

      - name: Run exe Acceptance
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./build/scripts/check_exe.py --build-subdir=build

      - name: Verify Static Linkage
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run python ./build/scripts/verify_static_linkage.py --build-dir=out/build

      - name: Run Smoke Test
        shell: bash
        run: |
          exe=""
          if [[ "${{ matrix.plat }}" == "windows" ]]; then exe=".exe"; fi
          bin="./out/build/alcy${exe}"

          version_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --version)
          echo "$version_out"

          help_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --help)
          echo "$help_out"
