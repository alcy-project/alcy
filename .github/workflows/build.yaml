name: Build & Test

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        llvm_version: [22.1.8]
        nix: [false, true]
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.gz
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.gz
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
        exclude:
          - os: windows-2025-vs2026
            nix: true

    env:
      COLORTERM: 256color
      basename: alcy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Nix
        if: matrix.nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup build environment (Standard)
        if: "!matrix.nix"
        uses: pug523/actions/cxx-gn-setup@d146feb314a2b253e6ccda6aba929c435d5dea1f
        with:
          os: ${{ runner.os }}
          llvm_version: ${{ matrix.llvm_version }}

      - name: Setup environment variables
        if: "!matrix.nix"
        shell: bash
        run: |
          echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH
          if [[ "${{ matrix.plat }}" != "windows" ]]; then
            echo "LIBCXX_INCLUDE_DIR=${{ env.LLVM_PATH }}/include/c++/v1" >> $GITHUB_ENV
          fi

          if [[ "${{ matrix.plat }}" == "linux" ]]; then
            TARGET_INC=$(echo "${{ env.LLVM_PATH }}/include/"*linux*/c++/v1)
            echo "LIBCXX_TARGET_INCLUDE_DIR=$TARGET_INC" >> $GITHUB_ENV
            LIB_DIR=$(echo "${{ env.LLVM_PATH }}/lib/"*linux*)
            echo "LIBCXX_LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
          elif [[ "${{ matrix.plat }}" == "macos" ]]; then
            LIB_DIR="${{ env.LLVM_PATH }}/lib"
            LIBCXX_DIR="$LIB_DIR/libc++/v1"
            shopt -s nullglob
            FILES=("$LIB_DIR"/libc++*)
            mkdir -p "$LIBCXX_DIR"
            if [ ${#FILES[@]} -gt 0 ]; then
              cp "${FILES[@]}" "$LIBCXX_DIR/"
            fi
            echo "LIBCXX_LIB_DIR=$LIBCXX_DIR" >> $GITHUB_ENV
            # echo "LIBCXX_LIB_DIR=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
          else
            echo "LIBCXX_LIB_DIR=${{ env.LLVM_PATH }}/lib" >> $GITHUB_ENV
          fi

      - name: Fetch LLVM tag
        shell: bash
        run: |
          git -C third_party/llvm/src fetch --tags --depth=1
          git -C third_party/llvm/src describe --tags --always

      - name: Cache LLVM tag
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/scripts/llvm/.llvm_tag_cache
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ matrix.llvm_version }}-llvm_tag_cache

      - name: Install uv
        if: "!matrix.nix"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Set up Python virtual environment
        if: "!matrix.nix"
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Cache third_party dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build/third_party
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ matrix.llvm_version }}-third_party_dependencies

      - name: Build (Nix)
        if: matrix.nix
        shell: bash
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/build.py --target=default --mode=${{ inputs.build_type }} --build-subdir=build"

      - name: Build (Standard)
        if: "!matrix.nix"
        shell: bash
        run: uv run ./build/scripts/build.py --target=default --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Build tests and run (Nix)
        if: matrix.nix
        shell: bash
        run: |
          nix develop .#default --command bash -c "uv run ./build/scripts/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build"

      - name: Build tests and run (Standard)
        if: "!matrix.nix"
        shell: bash
        run: uv run ./build/scripts/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Lint
        if: runner.os == 'Linux' && inputs.build_type == 'debug' && !matrix.nix
        shell: bash
        run: uv run ./build/scripts/lint.py

      - name: Clean third_party build outputs
        shell: bash
        run: rm -rf out/build/third_party


      - name: Verify static linkage (Nix)
        if: matrix.nix
        shell: bash
        run: |
          set -euo pipefail
          echo "Entering Nix development environment..."
          nix develop .#default --command bash -c '
            set -euo pipefail
            echo "Verifying tools..."
            command -v llvm-readobj
            llvm-readobj --version
            echo "Running static linkage verification..."
            uv run python ./build/scripts/verify_static_linkage.py \
              --build-dir=out/build
          '

      - name: Verify static linkage (Standard)
        if: "!matrix.nix"
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying tools..."
          command -v llvm-readobj
          llvm-readobj --version
          echo "Running static linkage verification..."
          uv run python ./build/scripts/verify_static_linkage.py \
            --build-dir=out/build

      - name: Package & Generate Checksum
        shell: bash
        run: |
          mkdir -p dist
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          if [ -f README.md ]; then cp README.md dist/; fi

          # Copy binaries from build output, explicitly ignoring third_party
          rsync -av --exclude='third_party' out/build/ dist/ 2>/dev/null || cp -r out/build/* dist/ 2>/dev/null || true
          rm -rf dist/third_party

          FILE="${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}.${{ matrix.archive }}"
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            cd dist && 7z a "../${FILE}" * && cd ..
          else
            cd dist && tar -czvf "../${FILE}" * && cd ..
          fi

          if command -v sha256sum &> /dev/null; then
            sha256sum "$FILE" > "${FILE}.sha256"
          else
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: |
            *.${{ matrix.archive }}
            *.sha256
