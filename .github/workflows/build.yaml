name: Build & Test

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      # 'ci': build the compiler, run all verifications, and package all outputs (including tests and benchmarks).
      # 'release': build the compiler, run all verifications, and package release binaries/libraries only.
      role:
        description: "Build role ('ci' or 'release')"
        required: false
        default: "ci"
        type: string
      llvm_version:
        description: "Prebuilt LLVM version."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ inputs.role }}${{ matrix.nix && '-nix' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: false
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            archive: tar.zst
            nix: true
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: false
          - os: macos-26
            plat: macos
            arch: arm64
            archive: tar.zst
            nix: true
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            archive: zip
            nix: false

    env:
      COLORTERM: 256color

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: ${{ matrix.nix && 'true' || 'false' }}
          os: ${{ runner.os }}
          llvm-version: ${{ inputs.llvm_version }}

      - name: Cache Build Directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: out/build
          key: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ inputs.llvm_version }}-build-dir-${{ hashFiles('.gn', 'BUILD.gn', 'compiler/**') }}
          restore-keys: ${{ runner.os }}-${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}-${{ matrix.nix }}-${{ inputs.llvm_version }}-build-dir-

      - name: Build All
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/build.py --target=all --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Package & Generate Checksum
        shell: bash
        run: |
          ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/package.py \
            --plat="${{ matrix.plat }}" \
            --arch="${{ matrix.arch }}" \
            --mode="${{ inputs.build_type }}" \
            --role="${{ inputs.role }}" \
            --archive="${{ matrix.archive }}" \
            ${{ matrix.nix && '--nix' || '' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}-${{ inputs.build_type }}${{ matrix.nix && '-nix' || '' }}
          path: |
            *.${{ matrix.archive }}
            *.sha256
          if-no-files-found: error

      - name: Run Tests
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/run.py --target=tests --mode=${{ inputs.build_type }} --build-subdir=build

      - name: Run e2e Acceptance
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_e2e.py --build-subdir=build

      # The wasm cases run under bun. The pinned series is the one the
      # runner is tested against; the runner image's own runtime is not
      # trusted for them.
      - name: Read the Pinned Bun
        id: bun
        shell: bash
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["bun_version"])')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Run Wasm Acceptance
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_wasm.py --build-subdir=build

      - name: Check Borrow Rules
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_borrow_rules.py --build-subdir=build

      - name: Run exe Acceptance
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_exe.py --build-subdir=build

      # The samples run through the same harness as the test cases, so a
      # program kept as an example is also a program that still compiles
      # and still prints what it says it prints.
      - name: Run Samples
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/check_exe.py --build-subdir=build --cases-root=samples

      - name: Verify Static Linkage
        shell: bash
        run: ${{ matrix.nix && 'nix develop .#default --command ' || '' }}uv run ./tools/verify_static_linkage.py --build-dir=out/build

      # The benchmark harness is checked once, in the CI workflow's
      # `benchmarks` job, rather than in each of the ten matrix entries.
      # It judges shape and not timing, so every entry was answering the
      # same question ten times over.

      - name: Run Smoke Test
        shell: bash
        run: |
          exe=""
          if [[ "${{ matrix.plat }}" == "windows" ]]; then exe=".exe"; fi
          bin="./out/build/alcy${exe}"

          version_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --version)
          echo "$version_out"

          help_out=$(${{ matrix.nix && 'nix develop .#default --command ' || '' }}"$bin" --help)
          echo "$help_out"
