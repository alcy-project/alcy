name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bun_version: ${{ steps.parse.outputs.bun_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Parse config.toml
        id: parse
        run: |
          bun_ver=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["bun_version"])')
          echo "bun_version=${bun_ver}" >> $GITHUB_OUTPUT

  build-release:
    needs: [load-config]
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: release
      bun_version: ${{ needs.load-config.outputs.bun_version }}

  build-wasm:
    needs: [load-config]
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: release
      bun_version: ${{ needs.load-config.outputs.bun_version }}

  publish:
    needs: [build-release, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download All Workflow Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            */*.tar.gz
            */*.tar.zst
            */*.zip
            */*.sha256
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: publish
    if: always()
    uses: ./.github/workflows/generate-summary.yaml
    with:
      artifact_pattern: "*"
