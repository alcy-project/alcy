name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build-release:
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: release

  build-wasm:
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: release

  # A tag is what publishes; a workflow_dispatch run builds everything a
  # release builds and stops, so the pipeline a tag walks is one that has
  # been walked rather than one that is being discovered.
  publish:
    needs: [build-release, build-wasm]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download All Workflow Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333

      # The runner already carries the gh CLI, so the release step needs
      # no third-party action. If the draft exists the release is left
      # as it is and its assets are replaced; a published release is
      # never turned back into a draft by a re-run.
      - name: Upload Artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*/*.tar.gz */*.tar.zst */*.zip */*.sha256)
          if (( ${#files[@]} == 0 )); then
            echo "::error::no release artifacts were found to upload"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --draft --verify-tag "${files[@]}"
          fi

  summary:
    needs: publish
    if: always()
    uses: ./.github/workflows/artifacts-summary.yaml
    with:
      artifact_pattern: "*"
