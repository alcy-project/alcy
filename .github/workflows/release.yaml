name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    uses: ./.github/workflows/build.yaml
    with:
      build_type: release
      role: release

  build-wasm:
    uses: ./.github/workflows/build-wasm.yaml
    with:
      build_type: release
      role: release

  publish:
    needs: [build-release, build-wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download All Workflow Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            */*.tar.gz
            */*.tar.zst
            */*.zip
            */*.sha256
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: publish
    if: always()
    uses: ./.github/workflows/generate-summary.yaml
    with:
      artifact_pattern: "*"
