name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spelling:
    name: Spell Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Spell Check Repository
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux

      - name: Check Formatting
        run: uv run ./tools/format.py --dry-run

  specification:
    name: Specification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      # The specification states what a program is written against, so it
      # names no file, module, symbol, or diagnostic code of the compiler
      # that implements it. It reads documents and needs no build, no
      # toolchain, and no submodule, so it does not belong in a job that
      # pays for all three.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Check the Specification
        shell: bash
        run: uv run ./tools/check_spec.py

  # The grammar's corpus is the specification read back as syntax, so it is
  # checked the way the specification is: no build, no toolchain, no
  # submodule. What it needs on top of that is the CLI, since the parser is
  # generated from grammar.js rather than written by hand.
  grammar:
    name: Grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Install the tree-sitter CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          TS_VERSION=$(python3 tools/config_values.py --get tree_sitter_cli_version)
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TS_VERSION}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Check the Grammar
        shell: bash
        run: uv run ./tools/check_treesitter.py --grammar

  # The tree's own linters share one setup and each costs less than a
  # second, so they share a job: four jobs would pay for the same
  # checkout and virtual environment four times for the same answer.
  tree-checks:
    name: Tree Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Read the pinned taplo
        id: versions
        run: echo "taplo=$(python3 tools/config_values.py --get taplo_version)" >> "$GITHUB_OUTPUT"

      - name: Install taplo
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: taplo@${{ steps.versions.outputs.taplo }}

      - name: Check TOML Formatting
        run: taplo fmt --check

      - name: Check Markdown
        run: uv run rumdl check .

      - name: Test the ast-grep Rules
        run: uv run ast-grep test

      - name: Scan the Compiler with the Rules
        run: uv run ast-grep scan --error compiler

      - name: Check the Python Tools
        run: |
          uv run ruff check tools
          uv run ruff format --check tools
