name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-24.04
    outputs:
      llvm_toolchain_version: ${{ steps.parse.outputs.llvm_toolchain_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Parse config.toml
        id: parse
        run: |
          TOOLCHAIN_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_toolchain_version"])')
          echo "llvm_toolchain_version=${TOOLCHAIN_VER}" >> $GITHUB_OUTPUT

  spelling:
    name: Spell Check
    needs: [load-config]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Spell Check Repository
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461

  format:
    name: Format
    needs: [load-config]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Check Formatting
        run: uv run ./tools/format.py --dry-run

  specification:
    name: Specification
    needs: [load-config]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      # The specification states what a program is written against, so it
      # names no file, module, symbol, or diagnostic code of the compiler
      # that implements it. It reads documents and needs no build, no
      # toolchain, and no submodule, so it does not belong in a job that
      # pays for all three.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Check the Specification
        shell: bash
        run: uv run ./tools/check_spec.py
