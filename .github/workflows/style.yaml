name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    name: Load Config
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      llvm_toolchain_version: ${{ steps.parse.outputs.llvm_toolchain_version }}
      taplo_version: ${{ steps.parse.outputs.taplo_version }}
      tree_sitter_cli_version: ${{ steps.parse.outputs.tree_sitter_cli_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Parse config.toml
        id: parse
        run: |
          TOOLCHAIN_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["llvm_toolchain_version"])')
          echo "llvm_toolchain_version=${TOOLCHAIN_VER}" >> $GITHUB_OUTPUT
          TAPLO_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["taplo_version"])')
          echo "taplo_version=${TAPLO_VER}" >> $GITHUB_OUTPUT
          TS_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("config.toml", "rb"))["tree_sitter_cli_version"])')
          echo "tree_sitter_cli_version=${TS_VER}" >> $GITHUB_OUTPUT

  spelling:
    name: Spell Check
    needs: [load-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Spell Check Repository
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461

  format:
    name: Format
    needs: [load-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          nix: "false"
          os: Linux
          llvm-version: ${{ needs.load-config.outputs.llvm_toolchain_version }}

      - name: Check Formatting
        run: uv run ./tools/format.py --dry-run

  specification:
    name: Specification
    needs: [load-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      # The specification states what a program is written against, so it
      # names no file, module, symbol, or diagnostic code of the compiler
      # that implements it. It reads documents and needs no build, no
      # toolchain, and no submodule, so it does not belong in a job that
      # pays for all three.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Check the Specification
        shell: bash
        run: uv run ./tools/check_spec.py

  # The grammar's corpus is the specification read back as syntax, so it is
  # checked the way the specification is: no build, no toolchain, no
  # submodule. What it needs on top of that is the CLI, since the parser is
  # generated from grammar.js rather than written by hand.
  grammar:
    name: Grammar
    needs: [load-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      # grammar.json is formatted by whichever CLI wrote it, so the version
      # that generates the parser is the one config.toml records rather than
      # the one the runner happens to carry.
      - name: Install the tree-sitter CLI
        run: npm install --global "tree-sitter-cli@${{ needs.load-config.outputs.tree_sitter_cli_version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Check the Grammar
        shell: bash
        run: uv run ./tools/check_treesitter.py --grammar

  # The tree's own linters share one setup and each costs less than a
  # second, so they share a job: four jobs would pay for the same
  # checkout and virtual environment four times for the same answer.
  tree-checks:
    name: Tree Checks
    needs: [load-config]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install taplo
        uses: ./.github/actions/install-taplo
        with:
          version: ${{ needs.load-config.outputs.taplo_version }}

      - name: Check TOML Formatting
        run: taplo fmt --check

      - name: Check Markdown
        run: uv run rumdl check .

      - name: Test the ast-grep Rules
        run: uv run ast-grep test

      - name: Scan the Compiler with the Rules
        run: uv run ast-grep scan --error compiler

      - name: Check the Python Tools
        run: |
          uv run ruff check tools
          uv run ruff format --check tools
