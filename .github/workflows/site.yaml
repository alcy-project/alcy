name: Site

on:
  push:
    branches: [main]
    # A release tag redeploys the same commit with the tag as the build's
    # stamp, so the published footer names the release.
    tags: ["v*"]
    paths: &site_paths
      - site/**
      - docs/guide/**
      - src/**
      - lib/**
      - treesitter/**
      - build/**
      - third_party/**
      - tools/**
      - pyproject.toml
      - uv.lock
      - config.toml
      - .github/workflows/site.yaml
      - .github/actions/**
  # The site builds on the pull request too: a change that breaks the
  # assembly or the generator's tests is one a merge should not have to
  # discover.
  pull_request:
    branches: [main]
    paths: *site_paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits rather than cancels so the
# site never lands in a half-published state. A pull request deploys
# nothing, so it never joins that queue, and a newer push to the same
# request cancels the run it superseded.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The compiler target the playground page calls: a C ABI with no LLVM,
  # built for Emscripten.
  COMPILER_TARGET: playground
  # The compiler carries no backend but the direct wasm one
  # (see src/backends.gni).
  ALCY_GN_ARGS: alcy_backends=[]
  BUILD_SUBDIR: playground

jobs:
  build:
    name: Build & Upload Site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984

      - name: Setup GN
        uses: pug523/actions/setup-gn@6a99c1e7020935c77ea80adc3ed0e9365ec8a209

      - name: Install Ninja
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Setup Python Virtual Environment
        run: |
          uv python install
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install the tree-sitter CLI
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          TS_VERSION=$(python3 tools/config_values.py --get tree_sitter_cli_version)
          curl -fsSL -o tree-sitter-cli.zip \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TS_VERSION}/tree-sitter-cli-linux-x64.zip"
          unzip -o tree-sitter-cli.zip -d "$HOME/.local/bin" tree-sitter
          rm tree-sitter-cli.zip
          tree-sitter --version

      - name: Read the pinned bun
        id: bun
        shell: bash
        run: echo "version=$(python3 tools/config_values.py --get bun_version)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Cache the Compiler Build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            out/playground
            out/site-cache
          key: ${{ runner.os }}-site-wasm32-release-build-dir-${{ hashFiles('config.toml', '**/*.gn', 'src/**', 'lib/**') }}

      - name: Cache tree-sitter's Wasm Toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-site-tree-sitter-${{ hashFiles('config.toml') }}

      - name: Build the Compiler Wasm Module
        shell: bash
        run: |
          uv run ./tools/build.py \
            --target="$COMPILER_TARGET" \
            --mode=release \
            --build-subdir="$BUILD_SUBDIR" \
            --target-os=emscripten \
            --gn-arg="$ALCY_GN_ARGS"

      # The smoke compiles and runs a program through the same ABI the page
      # uses, so a broken module fails here rather than in the browser.
      - name: Run the Playground Smoke
        shell: bash
        run: uv run ./tools/check_playground.py --build-subdir="$BUILD_SUBDIR"

      - name: Test the Guide's Generator
        shell: bash
        run: uv run ./tools/site.py test

      - name: Assemble the Site
        shell: bash
        env:
          # A tagged build names itself by the tag; a branch build falls
          # back to its commit. The checkout is shallow, so the event's
          # ref is the reliable source for the tag.
          ALCY_BUILD_STAMP: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run ./tools/site.py build --mode=release --build-subdir="$BUILD_SUBDIR"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload the Site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    # A pull request builds the site and stops: only what landed on main
    # is ever published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
