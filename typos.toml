[files]
extend-exclude = [
  "third_party/doctest/src",
  "third_party/fmt/src",
  "third_party/fpag/src",
  "third_party/llvm/src",
  "third_party/toml/src",
  "third_party/xxhash/src",
  # Generated by `tree-sitter generate` from grammar.js, like the vendored
  # sources above: the spell checker has no business in it.
  "treesitter/src",
]

[default.extend-words]
restat = "restat"
OLT = "OLT"
# LLVM API name (llvm::IRBuilderBase::CreateMemCpy)
Cpy = "Cpy"
# Windows API: _O_WRONLY
WRONLY = "WRONLY"
# Misspellings under test: the suggestion tests feed the matcher typos
# on purpose (compiler/tests/cli/*suggest*, parse_args_test,
# parse_output_test), and per-file scopes do not apply in this typos
# version, so these stand down globally.
buid = "buid"
buil = "buil"
comiple = "comiple"
chek = "chek"
outpu = "outpu"
abd = "abd"
halp = "halp"
