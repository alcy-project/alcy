[files]
extend-exclude = [
  "third_party/*/src",
  # Generated by `tree-sitter generate` from grammar.js, like the vendored
  # sources above: the spell checker has no business in it.
  "treesitter/src",
]

# Words from the compiler's own vocabulary. These appear in production
# sources, not just in test inputs.
[default.extend-words]
# GN's restat attribute on ninja actions (build/toolchains/*.gni): a keyword,
# not a misspelling.
restat = "restat"
# LLVM opcode FCMP_OLT, split by the checker at the underscore.
OLT = "OLT"
# LLVM API name (llvm::IRBuilderBase::CreateMemCpy).
Cpy = "Cpy"
# Errno offset name e_acces (EACCES) and Windows API O_WRONLY: the errno
# map names its slots after the signal's short name.
WRONLY = "WRONLY"
acces = "acces"
# The ELF relocation section, .rela.dyn.
rela = "rela"
# C++20 <bit> API std::countr_zero.
countr = "countr"
# RISC-V floating-point compare-less-than-or-equal mnemonic and its
# spelling in printed assembly.
Fle = "Fle"
fle = "fle"
# Floating-point register, the ISA abbreviation used by the direct backends.
FPR = "FPR"
fpr = "fpr"

# Intentional misspellings and truncations in editor and CLI test inputs.
# typos 1.48 scopes words by file-name pattern, not by directory; test
# sources are the files ending in _test.cc.
[type.test-inputs]
extend-glob = ["**/*_test.cc"]
check-file = true

[type.test-inputs.extend-words]
buid = "buid"
buil = "buil"
comiple = "comiple"
chek = "chek"
outpu = "outpu"
halp = "halp"
abd = "abd"
# The String::truncate and strip_suffix cases cut "hello" short.
hel = "hel"
# Completion tests request a prefix of "Some" ("Som" and "Option::Som").
Som = "Som"
# The workspace_symbols subsequence test queries "pn" ("Point").
pn = "pn"

# The same truncated strings also appear in #[test] blocks in the standard
# library and in .al acceptance cases, so allow them only in .al sources.
[type.al-sources]
extend-glob = ["**/*.al"]
check-file = true

[type.al-sources.extend-words]
abd = "abd"
hel = "hel"
