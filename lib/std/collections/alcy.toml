# Part of the `alcy/std` suite.
#
# The containers with lookup algorithms.

[package]
name = "collections"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"

[modules]
include = ["prelude", "map", "set"]
# The public surface, spelled as the manifest package sees it.
# Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = ["prelude", "map", "set"]

[dependencies]
"alcy/std/core" = {}
"alcy/std/alloc" = {}
"alcy/std/text" = {}
"alcy/std/unicode" = {}
