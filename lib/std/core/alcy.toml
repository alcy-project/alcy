# Part of the `alcy/std` suite.
#
# Language primitives, with no dependency on any other package.

[package]
name = "core"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"

[modules]
include = [
  "prelude",
  "anchor",
  "callable",
  "iterator",
  "mem",
  "option",
  "range",
  "result",
  "slice",
  "string",
  "parse",
  "index",
  "cmp",
  "ops",
  "hash",
]
# The public surface, in the form  specifies. Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = [
  "prelude",
  "anchor",
  "callable",
  "iterator",
  "mem",
  "option",
  "range",
  "result",
  "slice",
  "string",
  "parse",
  "index",
  "cmp",
  "ops",
  "hash",
]

# Specs only this suite may implement. Indexing and
# equality are operators, so their capabilities are the compiler's,
# not a user's; arithmetic joins them, and so does calling
#.
[spec]
suite-only = [
  "Index",
  "IndexMut",
  "PartialEq",
  "Eq",
  "PartialOrd",
  "Ord",
  "Add",
  "Sub",
  "Mul",
  "Div",
  "Rem",
  "Neg",
  "Fn",
]
