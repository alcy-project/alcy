# The alcy standard library, as a suite.
#
# A suite is a named set of packages. `"alcy/std/*" = {}` pulls every
# member below; `"alcy/std/core" = {}` pulls one. There are no suites
# in suites, so a three-segment path is always a package. See
# docs/adr/0016-suites-and-the-std-split.md.
[suite]
name = "std"
license = "Apache-2.0 WITH LLVM-exception"
owner = "alcy"
packages = [
  "core",
  "fmt",
  "alloc",
  "atomic",
  "sync",
  "io",
  "network",
  "thread",
  "arch",
  "simd",
  "time",
]
