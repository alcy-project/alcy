# Part of the `alcy/std` suite; see docs/adr/0016-suites-and-the-std-split.md.
#
# The platform floor: descriptors, the faithful calls on them, and the
# process's arguments (ADR-0128). Depends on `core` alone.

[package]
name = "sys"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"

[modules]
include = ["prelude", "fd", "error", "raw", "args"]
# The public surface, in the form `docs/adr/0007-manifest-driven-modules.md` specifies. Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = ["prelude", "fd", "error", "raw", "args"]

[dependencies]
"alcy/std/core" = {}
