# Part of the `alcy/std` suite.
#
# Files, readers, writers, and the standard streams.

[package]
name = "io"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"

[modules]
include = ["prelude", "args", "file", "print", "reader", "scanner"]
# The public surface, spelled as the manifest package sees it.
# Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = ["prelude", "args", "file", "print", "reader", "scanner"]

[dependencies]
"alcy/std/core" = {}
"alcy/std/sys" = {}
"alcy/std/alloc" = {}
"alcy/std/sort" = {}
"alcy/std/arch" = {}
"alcy/std/fmt" = {}
"alcy/std/text" = {}
"alcy/std/unicode" = {}
"alcy/std/path" = {}
