# Part of the `alcy/std` suite; see docs/adr/0016.
#
# Target-specific operations: caches, barriers, port I/O.

[package]
name = "arch"
version = "0.1.0"

[modules]
include = [
  "prelude",
]
# The public surface, in the form ADR-0007 specifies. Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = [
  "prelude",
]

[dependencies]
"alcy/std/core" = {}
