# Part of the `alcy/std` suite; see docs/adr/0016-suites-and-the-std-split.md.
#
# Spawning and joining threads of execution.

[package]
name = "thread"
version = "0.1.0"

[modules]
include = ["prelude"]
# The public surface, in the form `docs/adr/0007-manifest-driven-modules.md` specifies. Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = ["prelude"]

[dependencies]
"alcy/std/core" = {}
