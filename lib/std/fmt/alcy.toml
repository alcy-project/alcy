# Part of the `alcy/std` suite; see docs/adr/0016-suites-and-the-std-split.md.
#
# Compile-time expanded formatting into a caller's buffer.

[package]
name = "fmt"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"

[modules]
include = ["prelude", "display", "format", "write"]
# The public surface, in the form `docs/adr/0007-manifest-driven-modules.md` specifies. Nothing
# enforces it yet. Its `pub` items are also the implicit surface:
# a program depending on this package sees them with no `use`.
export = ["prelude", "display", "format", "write"]

[dependencies]
"alcy/std/core" = {}
"alcy/std/alloc" = {}

# Specs only this suite may implement (ADR-0053). `{}` is the
# compiler's operator for user types, so its capability is sealed like
# the others.
[spec]
suite-only = ["Display"]
